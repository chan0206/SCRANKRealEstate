name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: |
        cd SCRANKRealEstate
        dotnet restore
        cd ../SCRANKRealEstate.StaticGen
        dotnet restore
    
    - name: Run MVC app in background
      run: |
        cd SCRANKRealEstate
        nohup dotnet run --urls "http://localhost:5179" > app.log 2>&1 &
        echo "Waiting for app to start..."
        sleep 20
        curl -f http://localhost:5179 || (echo "App failed to start:" && cat app.log && exit 1)
    
    - name: Generate static site
      run: |
        cd SCRANKRealEstate.StaticGen
        dotnet run
    
    - name: Verify static site was created
      run: |
        echo "Contents of wwwroot-static:"
        ls -la SCRANKRealEstate/wwwroot-static/ || echo "Directory not found"
        echo "Checking for index.html:"
        test -f SCRANKRealEstate/wwwroot-static/index.html && echo "✓ index.html exists" || echo "✗ index.html not found"
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './SCRANKRealEstate/wwwroot-static'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4